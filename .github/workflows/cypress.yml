name: Cypress E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run smoke suite (Chrome)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/smoke/**/*.cy.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-smoke-reports
          path: |
            reports/
            cypress/screenshots/
          retention-days: 14

  regression:
    name: Regression Tests
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run regression suite (Chrome)
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          spec: cypress/e2e/regression/**/*.cy.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-regression-reports
          path: |
            reports/
            cypress/screenshots/
            cypress/videos/
          retention-days: 14
